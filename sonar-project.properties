sonar.projectKey=sensus-proj_sensus-app-mobile
sonar.organization=sensus-proj
sonar.sources=app/src/main/java
sonar.tests=app/src/test/java
sonar.cpd.exclusions=**/ui/merchant/**,**/ui/auth/OnboardingLocationScreen.kt,**/ui/buyer/CartBottomSheet.kt,**/ui/buyer/ActiveApartadoScreen.kt

# Cobertura: mismo alcance que el gate de Kover (app/build.gradle.kts, bloque kover.reports.filters,
# y scripts/check_coverage.py --min 80). Mantener ambos sincronizados al cambiar uno.
# 1) Kover solo incluye domain.* y presentation.*: fuera de cobertura el resto de paquetes.
# 2) Exclusiones por nombre de Kover (*Screen*Kt*, *Dialog*Kt*, *Utils*, ...) traducidas a archivos
#    con sufijo exacto, para no atrapar p. ej. MainScreenViewModel.kt, que Kover sí mide.
sonar.coverage.exclusions=\
  app/src/main/java/com/example/sensus/*.kt,\
  app/src/main/java/com/example/sensus/common/**,\
  app/src/main/java/com/example/sensus/data/**,\
  app/src/main/java/com/example/sensus/di/**,\
  app/src/main/java/com/example/sensus/theme/**,\
  app/src/main/java/com/example/sensus/presentation/common/**,\
  app/src/main/java/com/example/sensus/presentation/components/**,\
  **/*Screen.kt,\
  **/*Screens.kt,\
  **/*ScreenLayout.kt,\
  **/*ScreenActions.kt,\
  **/*Modal.kt,\
  **/*Dialog.kt,\
  **/*Dialogs.kt,\
  **/*Sheet.kt,\
  **/*Container.kt,\
  **/*Components.kt,\
  **/*Overlays.kt,\
  **/*Menu.kt,\
  **/*Utils.kt,\
  **/*Icons.kt,\
  **/*NavTab*.kt

name: ci

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Reintentos y timeouts HTTP de Gradle ante fallos transitorios de Maven Central (E-07).
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.internal.repository.max.retries=5 -Dorg.gradle.internal.repository.initial.backoff=2000 -Dorg.gradle.internal.http.connectionTimeout=60000 -Dorg.gradle.internal.http.socketTimeout=60000"

# Orden: wrapper -> gates SDD -> SAST -> analisis -> tests -> integracion -> build -> cicd-summary.
# Sin generacion de APK/AAB: el build solo valida compilacion.
jobs:
  validate-wrapper:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: gradle/wrapper-validation-action@b5418f5a58f5fd2eb486dd7efb368fe7be7eae45 # v2

  sdd-gates:
    needs: validate-wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Estructura SDD
        shell: bash
        run: python scripts/check_sdd.py | tee sdd-gates.txt
      - name: Capas Clean
        if: ${{ !cancelled() }}
        shell: bash
        run: python scripts/check_layers.py | tee -a sdd-gates.txt
      - name: Endpoints internos
        if: ${{ !cancelled() }}
        shell: bash
        run: python scripts/check_endpoints.py | tee -a sdd-gates.txt
      - name: Secretos
        if: ${{ !cancelled() }}
        shell: bash
        run: python scripts/check_secrets.py | tee -a sdd-gates.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: sdd-gates
          path: sdd-gates.txt
          if-no-files-found: ignore
          retention-days: 7

  security-scan:
    needs: sdd-gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d # v3
        with:
          languages: java-kotlin
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17
      # Cache de Gradle gestionada por setup-gradle (E-07): un solo dueno de ~/.gradle y
      # entradas por job. Escriben solo main y develop; los PR la leen de su rama base.
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}
      - run: chmod +x ./gradlew
      # CodeQL necesita trazar la compilacion. Se compila sin generar APK (regla del proyecto).
      - run: ./gradlew compileDebugKotlin --no-daemon
      - uses: github/codeql-action/analyze@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d # v3

  static-analysis:
    needs: security-scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17
      # Cache de Gradle gestionada por setup-gradle (E-07): un solo dueno de ~/.gradle y
      # entradas por job. Escriben solo main y develop; los PR la leen de su rama base.
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}
      - run: chmod +x ./gradlew
      - run: ./gradlew lint detekt ktlintCheck --no-daemon

  unit-test:
    needs: static-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17
      # Cache de Gradle gestionada por setup-gradle (E-07): un solo dueno de ~/.gradle y
      # entradas por job. Escriben solo main y develop; los PR la leen de su rama base.
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: chmod +x ./gradlew
      - run: ./gradlew testDebugUnitTest koverXmlReportDebug koverVerifyDebug --no-daemon
      - run: python scripts/check_coverage.py --min 80 --require-report --report app/build/reports/kover/reportDebug.xml
      - name: Subir reporte de tests
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

  mutation-test:
    needs: unit-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17
      # Cache de Gradle gestionada por setup-gradle (E-07): un solo dueno de ~/.gradle y
      # entradas por job. Escriben solo main y develop; los PR la leen de su rama base.
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}
      - run: chmod +x ./gradlew
      - run: ./gradlew pitestDebug --no-daemon --no-configuration-cache
      - name: Subir reporte de mutacion
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pitest-reports
          path: app/build/reports/pitest/
          if-no-files-found: ignore
          retention-days: 7

  instrumentation-compile:
    needs: unit-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17
      # Cache de Gradle gestionada por setup-gradle (E-07): un solo dueno de ~/.gradle y
      # entradas por job. Escriben solo main y develop; los PR la leen de su rama base.
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}
      - run: chmod +x ./gradlew
      - run: ./gradlew compileDebugAndroidTestSources --no-daemon

  build:
    needs: instrumentation-compile
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 17
      # Cache de Gradle gestionada por setup-gradle (E-07): un solo dueno de ~/.gradle y
      # entradas por job. Escriben solo main y develop; los PR la leen de su rama base.
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}
      - run: chmod +x ./gradlew
      # Sin APK: solo se valida la compilacion. El AAB firmado se genera en el release manual.
      - run: ./gradlew compileDebugKotlin --no-daemon

  # =========================================================================
  # APARTADO DE CI/CD: Tablero Visual y Resumen de Estado del Pipeline
  # =========================================================================
  cicd-summary:
    name: "Apartado CI/CD — Resumen de Pipeline"
    if: always()
    needs:
      - validate-wrapper
      - sdd-gates
      - security-scan
      - static-analysis
      - unit-test
      - mutation-test
      - instrumentation-compile
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Generar Apartado de CI/CD en Step Summary
        env:
          SENSUS_REF_NAME: ${{ github.ref_name }}
          SENSUS_COMMIT_SHA: ${{ github.sha }}
          SENSUS_EVENT_NAME: ${{ github.event_name }}
          SENSUS_EVENT_ACTOR: ${{ github.actor }}
          # Resultados por env y no inline: Semgrep no parsea ${{ }} dentro del script (falla --strict).
          RESULT_WRAPPER: ${{ needs.validate-wrapper.result }}
          RESULT_SDD: ${{ needs.sdd-gates.result }}
          RESULT_SECURITY: ${{ needs.security-scan.result }}
          RESULT_STATIC: ${{ needs.static-analysis.result }}
          RESULT_UNIT: ${{ needs.unit-test.result }}
          RESULT_MUTATION: ${{ needs.mutation-test.result }}
          RESULT_INSTRUMENTATION: ${{ needs.instrumentation-compile.result }}
        run: |
          status() { if [ "$1" = "success" ]; then echo "APROBADO"; else echo "FALLIDO"; fi; }
          echo "# Apartado de CI/CD — Resumen de Pipeline Sensus Mobile" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Este tablero resume el estado y cumplimiento de calidad de la ejecución actual en GitHub Actions." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Matriz de Compuertas de Integración Continua" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Etapa del Pipeline | Estado | Herramienta / Validador | Control |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **1. Gradle Wrapper** | $(status "$RESULT_WRAPPER") | \`gradle-wrapper-validation\` | Checksum oficial |" >> $GITHUB_STEP_SUMMARY
          echo "| **2. Compuertas SDD & Capas** | $(status "$RESULT_SDD") | \`check_*.py\` (5 scripts) | Clean Architecture & 0 Secretos |" >> $GITHUB_STEP_SUMMARY
          echo "| **3. SAST Semántico** | $(status "$RESULT_SECURITY") | \`CodeQL (Java/Kotlin)\` | OWASP Mobile Top 10 |" >> $GITHUB_STEP_SUMMARY
          echo "| **4. Análisis Estático** | $(status "$RESULT_STATIC") | \`Android SDK Lint\` | Correctitud y accesibilidad |" >> $GITHUB_STEP_SUMMARY
          echo "| **5. Pruebas Unitarias** | $(status "$RESULT_UNIT") | \`JUnit 5 + MockK + Turbine\` | Umbral de cobertura >= 80% |" >> $GITHUB_STEP_SUMMARY
          echo "| **6. Pruebas de Mutación** | $(status "$RESULT_MUTATION") | \`PITest 1.17.1\` | Umbral de mutación en dominio |" >> $GITHUB_STEP_SUMMARY
          echo "| **7. Compilación Instrumentada** | $(status "$RESULT_INSTRUMENTATION") | \`AndroidTest Sources\` | Pruebas de integración E2E |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Metadatos de la Ejecución" >> $GITHUB_STEP_SUMMARY
          printf -- '- **Rama:** `%s`\n' "$SENSUS_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
          printf -- '- **Commit:** `%s`\n' "$SENSUS_COMMIT_SHA" >> "$GITHUB_STEP_SUMMARY"
          printf -- '- **Evento:** `%s` por `%s`\n' "$SENSUS_EVENT_NAME" "$SENSUS_EVENT_ACTOR" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Documentación completa de CI/CD:** Ver [\`docs/cicd-pipeline.md\`](docs/cicd-pipeline.md)" >> $GITHUB_STEP_SUMMARY

name: release-playstore

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Pista de Google Play Console (internal, alpha, beta, production)"
        required: true
        default: "production"
        type: choice
        options:
          - "production"
          - "internal"
          - "alpha"
          - "beta"
      user_fraction:
        description: "Fracción de usuarios para rollout gradual (ej: 0.1, 0.25, 0.5, 1.0)"
        required: false
        default: "1.0"
        type: string
      dry_run:
        description: "Modo simulación (valida gates y compilación sin subir a Play Console)"
        required: false
        default: false
        type: boolean
  push:
    branches:
      - "main"
    tags:
      - "v*.*.*"

permissions:
  contents: read
  security-events: write

concurrency:
  group: release-playstore-${{ github.ref }}
  cancel-in-progress: false

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

jobs:
  # =========================================================================
  # 1. COMPUERTA ESTRICTA PRE-LANZAMIENTO (Quality & Security Gate)
  # Si CUALQUIER pipeline/gate falla, el despliegue a Play Store se CANCELA.
  # =========================================================================
  pre-flight-gates:
    name: "Validación estricta pre-lanzamiento"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validar rama autorizada (Exclusivamente main o tags)
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ] && [[ "${{ github.ref }}" != refs/tags/v* ]]; then
            echo "::error::Despliegue rechazado: Solo la rama 'main' (o tags oficiales 'v*.*.*') tiene autorización para desplegar o publicar en Google Play."
            exit 1
          fi

      - name: Validar Gradle Wrapper
        uses: gradle/wrapper-validation-action@v2

      - name: Configurar Python 3.12 para compuertas SDD
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar compuertas SDD y DevSecOps (Bloqueante)
        run: |
          echo "Ejecutando compuertas SDD..."
          python scripts/check_sdd.py
          python scripts/check_layers.py
          python scripts/check_endpoints.py
          python scripts/check_secrets.py

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache de dependencias Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Dar permisos de ejecución a gradlew
        run: chmod +x ./gradlew

      - name: Escaneo estricto de secretos (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Escaneo SAST de seguridad móvil (Semgrep)
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/default
            p/owasp-top-ten
            p/mobile

      - name: Análisis estático (Android Lint, Detekt, Ktlint)
        run: ./gradlew lint detekt ktlintCheck --no-daemon

      - name: Pruebas unitarias y verificación de cobertura Kover (>= 80%)
        run: |
          ./gradlew testDebugUnitTest koverXmlReportDebug koverVerifyDebug --no-daemon
          python scripts/check_coverage.py --min 80

      - name: Compilación instrumentada y verificación de build
        run: ./gradlew compileDebugAndroidTestSources compileDebugKotlin compileReleaseKotlin --no-daemon

  # =========================================================================
  # 2. COMPILACIÓN DE RELEASE Y DESPLIEUE A GOOGLE PLAY CONSOLE
  # Solo se ejecuta si pre-flight-gates está en VERDE.
  # =========================================================================
  build-and-deploy:
    name: "Compilación de AAB y Despliegue a Play Store"
    needs: pre-flight-gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: play-store-release
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Validar rama autorizada para despliegue (Exclusivamente main o tags)
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ] && [[ "${{ github.ref }}" != refs/tags/v* ]]; then
            echo "::error::Despliegue rechazado: Solo la rama 'main' (o tags oficiales 'v*.*.*') tiene autorización para desplegar o publicar en Google Play."
            exit 1
          fi

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache de dependencias Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Dar permisos de ejecución a gradlew
        run: chmod +x ./gradlew

      - name: Verificar aprovisionamiento del entorno Google Play Console
        id: check-env
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          PLAY_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          READY=true
          REASONS=""

          if [ "$DRY_RUN" = "true" ]; then
            READY=false
            REASONS="${REASONS}\n• Modo simulación (dry_run) solicitado explícitamente."
          fi

          if [ -z "$KEYSTORE_BASE64" ]; then
            READY=false
            REASONS="${REASONS}\n• Secreto KEYSTORE_BASE64 no configurado en GitHub Secrets."
          fi

          if [ -z "$PLAY_ACCOUNT_JSON" ]; then
            READY=false
            REASONS="${REASONS}\n• Secreto PLAY_STORE_SERVICE_ACCOUNT_JSON no configurado en GitHub Secrets."
          fi

          echo "ready=$READY" >> $GITHUB_OUTPUT

          if [ "$READY" = "true" ]; then
            echo "::notice::Entorno de Play Console verificado y credenciales detectadas. Procediendo al despliegue."
          else
            echo "::warning::El entorno de Google Play Console no está listo o faltan credenciales:$REASONS"
            echo "::notice::Quality Gates APROBADOS. El CI/CD está listo y en espera de las credenciales de producción."
          fi

      - name: Validar compilación de Release (Sintaxis y R8/ProGuard)
        run: |
          echo "Validando compilación de Release..."
          ./gradlew compileReleaseKotlin --no-daemon

      - name: Decodificar credenciales de firma y Service Account en runner efímero
        if: steps.check-env.outputs.ready == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          PLAY_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "${{ runner.temp }}/release.keystore"
          echo "$PLAY_ACCOUNT_JSON" > "${{ runner.temp }}/play-service-account.json"

      - name: Calcular versionCode incremental para Play Console
        if: steps.check-env.outputs.ready == 'true'
        id: version-config
        run: |
          COMPUTED_VERSION_CODE=$((4 + GITHUB_RUN_NUMBER))
          echo "version_code=$COMPUTED_VERSION_CODE" >> $GITHUB_OUTPUT
          echo "Using SENSUS_VERSION_CODE=$COMPUTED_VERSION_CODE"

      - name: Compilar Android App Bundle de Release firmado (AAB)
        if: steps.check-env.outputs.ready == 'true'
        env:
          SIGNING_STORE_FILE: "${{ runner.temp }}/release.keystore"
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SENSUS_VERSION_CODE: ${{ steps.version-config.outputs.version_code }}
        run: |
          ./gradlew bundleRelease --no-daemon

      - name: Determinar pista, estado y notas BCP-47 para Play Console
        if: steps.check-env.outputs.ready == 'true'
        id: release-config
        run: |
          TRACK="${{ inputs.track }}"
          FRACTION="${{ inputs.user_fraction }}"
          if [ -z "$TRACK" ]; then
            TRACK="production"
          fi

          STATUS="completed"
          OUT_FRACTION=""
          if [ -n "$FRACTION" ] && [ "$FRACTION" != "1" ] && [ "$FRACTION" != "1.0" ]; then
            STATUS="inProgress"
            OUT_FRACTION="$FRACTION"
          fi

          WHATSNEW_DIR="${{ runner.temp }}/whatsnew"
          mkdir -p "$WHATSNEW_DIR"
          for f in distribution/whatsnew/whatsnew-*; do
            [ -f "$f" ] || continue
            base="$(basename "$f" .txt)"
            cp "$f" "$WHATSNEW_DIR/$base"
          done

          echo "track=$TRACK" >> $GITHUB_OUTPUT
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          echo "fraction=$OUT_FRACTION" >> $GITHUB_OUTPUT
          echo "whatsnew_dir=$WHATSNEW_DIR" >> $GITHUB_OUTPUT

      - name: Publicar AAB en Google Play Console
        if: steps.check-env.outputs.ready == 'true'
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJson: "${{ runner.temp }}/play-service-account.json"
          packageName: "sensus.com"
          releaseFiles: "app/build/outputs/bundle/release/*.aab"
          track: ${{ steps.release-config.outputs.track }}
          status: ${{ steps.release-config.outputs.status }}
          userFraction: ${{ steps.release-config.outputs.fraction }}
          mappingFile: "app/build/outputs/mapping/release/mapping.txt"
          whatsNewDirectory: ${{ steps.release-config.outputs.whatsnew_dir }}

      - name: Limpieza higiénica de credenciales efímeras
        if: always()
        run: |
          rm -f "${{ runner.temp }}/release.keystore"
          rm -f "${{ runner.temp }}/play-service-account.json"

      - name: Resumen de Despliegue en Step Summary
        if: always()
        run: |
          echo "### 🚀 Estado del Despliegue a Google Play Console" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Compuertas de Calidad (Quality Gate):** ✅ APROBADO (Bloqueo terminante si algo falla)" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check-env.outputs.ready }}" = "true" ]; then
            echo "- **Publicación en Google Play:** 🟢 PUBLICADO exitosamente en la pista \`${{ steps.release-config.outputs.track }}\` (estado \`${{ steps.release-config.outputs.status }}\`, versionCode \`${{ steps.version-config.outputs.version_code }}\`)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Publicación en Google Play:** ⏸️ EN PAUSA (Entorno no aprovisionado o dry_run)" >> $GITHUB_STEP_SUMMARY
            echo "- **Detalle:** El pipeline CI/CD está 100% preparado." >> $GITHUB_STEP_SUMMARY
          fi

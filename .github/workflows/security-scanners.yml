name: security-scanners

on:
  pull_request:
  push:
  schedule:
    - cron: '0 3 * * 1' # Lunes a las 03:00 UTC (escaneo recurrente)
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: security-scanners-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

jobs:
  # -------------------------------------------------------------
  # 1. Compuertas de Secretos y Arquitectura Sensus (2 herramientas)
  # -------------------------------------------------------------
  sdd-and-secrets:
    name: "Compuertas SDD y Escaneo de Secretos"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Configurar Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # Herramienta 1: Sensus Security & Architecture Scripts
      - name: "1. Sensus SDD & Security Gates (Python)"
        run: |
          python scripts/check_sdd.py
          python scripts/check_layers.py
          python scripts/check_endpoints.py
          python scripts/check_secrets.py

      # Herramienta 2: Gitleaks
      - name: "2. Gitleaks (Detección de secretos en Git)"
        if: ${{ !cancelled() }}
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Herramienta 3: TruffleHog OSS
      - name: "3. TruffleHog (Escáner profundo de credenciales y entropía)"
        if: ${{ !cancelled() }}
        uses: trufflesecurity/trufflehog@4ef51f69ca6347aaa76a5e64a87eac9c0c909f71 # main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  # -------------------------------------------------------------
  # 2. Análisis Estático de Seguridad Móvil y SAST (3 herramientas)
  # -------------------------------------------------------------
  sast-mobile-security:
    name: "SAST y Seguridad Móvil Android"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configurar JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configurar Python 3.12 para MobSFscan
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # Herramienta 4: Semgrep SAST
      - name: "4. Semgrep SAST (OWASP Top 10, Kotlin y Java)"
        if: ${{ !cancelled() }}
        run: |
          python -m pip install semgrep==1.130.0 "setuptools<81"
          semgrep scan --error --strict --max-target-bytes=0 --sarif-output=semgrep.sarif \
            --config p/default --config p/owasp-top-ten --config p/kotlin --config p/java .

      - name: Subir reporte SARIF de Semgrep
        uses: github/codeql-action/upload-sarif@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d # v3
        if: always()
        with:
          sarif_file: semgrep.sarif

      # Herramienta 5: MobSFscan (Mobile Security Framework)
      - name: "5. MobSFscan (Seguridad Android, Manifiesto y Permisos)"
        if: ${{ !cancelled() }}
        uses: MobSF/mobsfscan@e48f780d04c4fdd38ec07c1de3d2210513f48ecd # main
        with:
          args: '. --sarif --exit-warning --output mobsfscan.sarif'

      - name: Subir reporte SARIF de MobSFscan
        uses: github/codeql-action/upload-sarif@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d # v3
        if: always()
        with:
          sarif_file: mobsfscan.sarif

  # -------------------------------------------------------------
  # 3. Calidad de Código Kotlin y Linting (3 herramientas)
  # -------------------------------------------------------------
  kotlin-quality-linters:
    name: "Linters y Calidad de Código Kotlin"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configurar JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Dar permisos de ejecución a gradlew
        run: chmod +x ./gradlew

      # Herramienta 6: Android SDK Lint
      - name: "6. Android SDK Lint"
        if: ${{ !cancelled() }}
        run: ./gradlew lint --no-daemon

      - name: Subir reporte de Android Lint
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-lint-reports
          path: app/build/reports/lint-results*
          if-no-files-found: ignore
          retention-days: 7

      # Herramienta 7: Detekt
      - name: "7. Detekt (Code Smells y Complejidad Ciclomática)"
        if: ${{ !cancelled() }}
        # Tarea Gradle del proyecto: mismo detekt.yml y versión que el gate local (la acción externa
        # fallaba en su propia configuración de Java).
        run: ./gradlew detekt --no-daemon

      # Herramienta 8: Ktlint
      - name: "8. Ktlint (Formato y Estilo Canónico Kotlin)"
        if: ${{ !cancelled() }}
        uses: ScaCap/action-ktlint@dda1600e3cb797439e775eb67ad204354bc88c94 # master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-check
          ktlint_version: '1.0.1'
          android: true

  # -------------------------------------------------------------
  # 4. Análisis de Vulnerabilidades y Dependencias SCA (3 herramientas)
  # -------------------------------------------------------------
  dependency-vulnerabilities:
    name: "SCA y Vulnerabilidades en Dependencias"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Herramienta 10: Aqua Security Trivy (Versión oficial con prefijo v)
      - name: "10. Trivy (Misconfigurations y CVEs en Repositorio)"
        if: ${{ !cancelled() }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Subir reporte SARIF de Trivy
        uses: github/codeql-action/upload-sarif@d2aacf54c2fbc910db8d7ec338fdb54ea48c692d # v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      # Herramienta 11: OWASP Dependency-Check
      - name: "11. OWASP Dependency-Check (SCA sobre dependencias)"
        if: ${{ !cancelled() }}
        uses: dependency-check/Dependency-Check_Action@1e54355a8b4c8abaa8cc7d0b70aa655a3bb15a6c # main
        with:
          project: 'Sensus-Mobile'
          path: '.'
          format: 'HTML'
          out: 'dependency-reports'
          args: >
            --failOnCVSS 7
            --enableRetired
            --suppression dependency-check-suppressions.xml

      - name: Subir reporte OWASP Dependency-Check
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: owasp-dependency-report
          path: dependency-reports
          if-no-files-found: ignore
          retention-days: 7

      # OSV va al final: setup-java exporta JAVA_HOME del runner y los contenedores de Dependency-Check
      # lo heredan como ruta inexistente.
      - name: Configurar JDK 17
        if: ${{ !cancelled() }}
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      - name: Generar lockfile de dependencias de release (fuente para OSV)
        if: ${{ !cancelled() }}
        run: |
          chmod +x ./gradlew
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --write-locks --no-daemon
          test -s app/gradle.lockfile

      # Herramienta 9: Google OSV-Scanner (Binario Oficial CLI)
      - name: "9. Google OSV-Scanner (Vulnerabilidades Open Source)"
        if: ${{ !cancelled() }}
        run: |
          curl -fsSL https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64 -o osv-scanner
          chmod +x osv-scanner
          ./osv-scanner scan source -L app/gradle.lockfile

  # -------------------------------------------------------------
  # 5. Escáneres Cloud Integrados con Tokens (2 herramientas)
  # -------------------------------------------------------------
  cloud-security-scanners:
    name: "Escáneres Cloud (SonarCloud y Snyk)"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Configurar JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17

      # Herramienta 12: SonarCloud (SAST & Quality Gate)
      # Se ejecuta si se configura SONAR_TOKEN en GitHub Secrets
      - name: "12. SonarCloud SAST (Ejecución condicionada por SONAR_TOKEN)"
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarcloud-github-action@ba3875ecf642b2129de2b589510c81a8b53dbf4e # master
        with:
          args: -Dsonar.qualitygate.wait=true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # Herramienta 13: Snyk Security (SCA & SAST)
      # Se ejecuta si se configura SNYK_TOKEN en GitHub Secrets
      - name: "13. Snyk Security Scanner (Ejecución condicionada por SNYK_TOKEN)"
        if: ${{ !cancelled() && env.SNYK_TOKEN != '' }}
        uses: snyk/actions/setup@11b673cfb4b0dc0d860a1323caa199d54950dcce # master

      - name: "13b. Snyk test sobre dependencias de release"
        if: ${{ !cancelled() && env.SNYK_TOKEN != '' }}
        run: |
          chmod +x ./gradlew
          snyk test --file=app/build.gradle.kts --configuration-matching='^releaseRuntimeClasspath$' --severity-threshold=high

  # -------------------------------------------------------------
  # 6. Resumen y Consolidación de Calidad
  # -------------------------------------------------------------
  scanners-summary:
    name: "Consolidación de Escáneres de Seguridad"
    needs: [sdd-and-secrets, sast-mobile-security, kotlin-quality-linters, dependency-vulnerabilities, cloud-security-scanners]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Consolidar resultados reales
        env:
          SCANNER_JOBS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "- \(.key): \(.value.result)"' <<< "$SCANNER_JOBS" >> "$GITHUB_STEP_SUMMARY"
          jq -e 'all(.[]; .result == "success")' <<< "$SCANNER_JOBS"
